name: Bug report
description: Something isn't working the way it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report this! The more detail, the faster it gets fixed.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Settings → Screen Breaks
        2. …
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows 11, Windows 10, macOS (Apple silicon), macOS (Intel), Linux (X11), Linux (Wayland)]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Yonder version
      placeholder: "1.0.12 (Settings → About)"
    validations:
      required: true
  - type: input
    id: install
    attributes:
      label: How did you install it?
      placeholder: Homebrew, .exe installer, .msi, .AppImage, .deb, built from source…
  - type: textarea
    id: logs
    attributes:
      label: Log file
      description: |
        Yonder keeps a small log of what it does. Open it from Settings → About → Troubleshooting → Open logs folder, or find `yonder.log` here:
        - Windows: `%LOCALAPPDATA%\app.yonder.desktop\logs`
        - macOS: `~/Library/Logs/app.yonder.desktop`
        - Linux: `~/.local/share/app.yonder.desktop/logs`

        Drag the file into this box, or paste the last lines. For hard-to-find bugs, turn on "Detailed logging" in the same place (or start Yonder with `--verbose`), reproduce the problem, then attach the log. It holds app names and Yonder's own events, nothing you type or see.
      placeholder: Drag yonder.log here, or paste the relevant lines
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, number of monitors, break style, which smart-pause options are on…
