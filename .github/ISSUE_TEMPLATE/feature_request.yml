name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation where Yonder falls short today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: dropdown
    id: platforms
    attributes:
      label: Which platforms does this matter on?
      multiple: true
      options: [Windows, macOS, Linux, All]
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd be interested in helping build this
