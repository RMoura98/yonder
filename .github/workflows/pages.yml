name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
      - ".github/scripts/build-apt-repo.sh"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  # A release event runs on the tag, which the github-pages environment doesn't allow
  # to deploy. Instead of loosening that rule, re-run this workflow on main.
  redeploy-from-main:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Re-run the deploy on main (refreshes the APT repository)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --repo "${{ github.repository }}" --ref main

  deploy:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Stage website
        run: |
          mkdir -p _site
          cp -r website/. _site/

      - name: Install APT tooling
        run: sudo apt-get update -qq && sudo apt-get install -y -qq apt-utils dpkg-dev

      - name: Build signed APT repository
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/build-apt-repo.sh _site

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
