[package]
name = "yonder"
version = "1.0.0"
description = "A tiny, open-source break reminder"
authors = ["Yonder contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "yonder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
base64 = "0.22"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
ureq = { version = "2", default-features = false, features = ["tls"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
xcap = "0.7"
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.60", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
