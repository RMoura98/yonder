<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Yonder countdown</title>
  <link rel="stylesheet" href="css/base.css" />
  <style>
    html, body { background: transparent; overflow: hidden; }
    .pill {
      position: absolute; left: 6px; top: 6px;
      display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px 6px 6px; border-radius: 999px;
      color: #EEF4F2; font-weight: 600; font-size: 13px; white-space: nowrap;
      background: linear-gradient(180deg, rgba(16, 48, 54, .84), rgba(7, 26, 30, .88));
      backdrop-filter: blur(20px) saturate(1.5);
      border: 1px solid rgba(255,255,255,.14); box-shadow: 0 10px 26px rgba(0,0,0,.35);
      animation: pop .4s cubic-bezier(.2,.9,.3,1.3) both;
    }
    .dot { width: 24px; height: 24px; border-radius: 8px; display: grid; place-items: center; color: #fff;
      background: radial-gradient(circle at 35% 30%, #FFE9C2, #F4C26B 50%, #E8875A); }
    #n { display: inline-block; min-width: .6em; font-variant-numeric: tabular-nums; }
    #n.tick { animation: tick .35s cubic-bezier(.2,.9,.3,1.3); }
    @keyframes pop { from { opacity: 0; transform: scale(.7); } }
    @keyframes tick { from { transform: translateY(-6px); opacity: 0; } }
  </style>
</head>
<body>
  <div class="pill"><span class="dot" id="dot"></span><span>Starting break in <span id="n">5</span></span></div>
  <script type="module">
    import { listen, invoke } from "./js/api.js";
    import { icon } from "./js/icons.js";
    document.getElementById("dot").innerHTML = icon("spa_fill", 15);
    const n = document.getElementById("n");
    const render = (s) => {
      if (s.phase !== "working") return;
      const v = String(Math.max(1, s.next_break_in));
      if (n.textContent !== v) { n.textContent = v; n.classList.remove("tick"); void n.offsetWidth; n.classList.add("tick"); }
    };
    render(await invoke("get_state"));
    listen("state", render);
  </script>
</body>
</html>
