<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Yonder status</title>
  <link rel="stylesheet" href="css/base.css" />
  <style>
    html, body { background: transparent; overflow: hidden; }
    :root { --e: cubic-bezier(.22,.8,.2,1); }
    /* 16px of room around the card for its shadow; the window is sized to the card + this margin */
    #card {
      margin: 16px; width: 300px; padding: 16px; display: flex; flex-direction: column; gap: 14px;
      background: color-mix(in srgb, var(--panel) 88%, transparent);
      backdrop-filter: blur(28px) saturate(1.6);
      border: 1px solid var(--line); border-radius: 18px;
      box-shadow: 0 10px 28px rgba(0,0,0,.22), 0 2px 6px rgba(0,0,0,.14);
      animation: pop .32s var(--e) both;
    }
    @keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.98); } }
    @media (prefers-reduced-motion: reduce) { #card { animation: none; } }

    .top { display: flex; align-items: center; gap: 16px; }
    .ring { position: relative; width: 104px; height: 104px; flex: none; }
    .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .ring circle { fill: none; stroke-width: 8; }
    .ring .track { stroke: var(--line); }
    .ring .progress { stroke: var(--accent); stroke-linecap: round; stroke-dasharray: 326.7; stroke-dashoffset: 326.7; transition: stroke-dashoffset 1s linear; }
    .ring.paused .progress { stroke: var(--ink-3); }
    .ring-text { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
    .ring-text .v { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
    .ring-text .v.small { font-size: 15px; }
    .meta { min-width: 0; }
    .meta .phase { font-size: 15px; font-weight: 650; }
    .meta .sub { font-size: 12.5px; color: var(--ink-2); margin-top: 2px; }
    .meta .label { font-size: 12px; color: var(--ink-3); margin-top: 6px; }

    .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .tile { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 9px 10px; min-width: 0; }
    .tile .l { font-size: 11px; color: var(--ink-3); line-height: 1.25; }
    .tile .v { font-size: 18px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; white-space: nowrap; }

    .actions { display: flex; flex-direction: column; gap: 8px; }
    .actions .btn { justify-content: center; padding: 8px 13px; }
    .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .pause-menu { display: grid; gap: 6px; }
    .pause-menu .btn { justify-content: flex-start; padding: 7px 12px; font-weight: 500; }
    .foot { display: flex; justify-content: center; }
    .foot .btn { color: var(--ink-2); font-weight: 500; }
  </style>
</head>
<body>
  <div id="card">
    <div class="top">
      <div class="ring" id="ring">
        <svg viewBox="0 0 120 120"><circle class="track" cx="60" cy="60" r="52"/><circle class="progress" id="prog" cx="60" cy="60" r="52"/></svg>
        <div class="ring-text"><div class="v" id="count">—</div></div>
      </div>
      <div class="meta">
        <div class="phase" id="phase"></div>
        <div class="sub" id="sub"></div>
        <div class="label" id="label"></div>
      </div>
    </div>

    <div class="tiles">
      <div class="tile"><div class="l">Screen time</div><div class="v" id="tScreen">—</div></div>
      <div class="tile"><div class="l">Breaks taken</div><div class="v" id="tTaken">—</div></div>
      <div class="tile"><div class="l">Screen score today</div><div class="v" id="tScore">—</div></div>
    </div>

    <div class="actions">
      <button class="btn primary" id="take"></button>
      <div class="pair">
        <button class="btn" id="pause"></button>
        <button class="btn" id="skip"></button>
      </div>
      <div class="pause-menu" id="pauseMenu" hidden>
        <button class="btn" data-pause="30"></button>
        <button class="btn" data-pause="60"></button>
        <button class="btn" data-pause="tomorrow"></button>
      </div>
    </div>
    <div class="foot"><button class="btn ghost" id="settings"></button></div>
  </div>

  <script type="module">
    import { invoke, listen, action, applyTheme, fmtClock, fmtHuman } from "./js/api.js";
    import { icon } from "./js/icons.js";
    import { initI18n, t } from "./js/i18n.js";

    const $ = (s) => document.querySelector(s);
    const settings = await invoke("get_settings");
    await initI18n(settings.language);
    applyTheme(settings.theme);

    // static labels (with their icons)
    const withIcon = (name, text) => `${icon(name, 17)}<span>${text}</span>`;
    document.querySelectorAll(".tile .l").forEach((el) => (el.textContent = t(el.textContent)));
    $("#take").innerHTML = withIcon("timer", t("Take a break now"));
    $("#skip").innerHTML = withIcon("skip_next", t("Skip next"));
    $("#settings").innerHTML = withIcon("settings", t("Settings…"));
    $('[data-pause="30"]').textContent = t("For 30 minutes");
    $('[data-pause="60"]').textContent = t("For 1 hour");
    $('[data-pause="tomorrow"]').textContent = t("Until tomorrow");

    const PHASES = { working: "Working", break: "On a break", paused: "Paused", smart: "Holding breaks", offhours: "Off the clock", away: "Away" };
    const dayKey = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    // same formula as the Stats page
    function score(d) {
      if (!d || !d.screen_secs) return "—";
      const expected = Math.max(1, Math.floor(d.screen_secs / (settings.work_mins * 60)));
      const ratio = Math.min(1, ((d.breaks_taken || 0) + (d.natural_breaks || 0)) / expected);
      const skipPenalty = Math.min(0.3, (d.breaks_skipped || 0) * 0.05);
      return Math.round(Math.max(0, ratio - skipPenalty) * 100);
    }

    let snap = null;
    const close = () => invoke("fit_window", { width: 0, height: 0 });
    let fitFrame = 0;
    const fit = () => {
      cancelAnimationFrame(fitFrame);
      fitFrame = requestAnimationFrame(() => {
        const r = $("#card").getBoundingClientRect();
        // 16px margin on every side for the shadow
        invoke("fit_window", { width: Math.ceil(r.width + 32), height: Math.ceil(r.height + 32) });
      });
    };

    function render(s) {
      snap = s;
      const paused = s.phase === "paused";
      const brk = s.phase === "break" && s.break;
      const count = $("#count");
      count.classList.toggle("small", paused);
      $("#ring").classList.toggle("paused", paused);
      if (brk) {
        count.textContent = fmtClock(s.break.total_secs - s.break.elapsed_secs);
        $("#sub").textContent = t("of break left");
        $("#prog").style.strokeDashoffset = String(326.7 * (s.break.elapsed_secs / s.break.total_secs));
      } else {
        count.textContent = paused ? t("Paused") : fmtClock(Math.max(0, s.next_break_in));
        $("#sub").textContent = paused ? "" : t(s.next_is_long ? "until long break" : "until next break");
        $("#prog").style.strokeDashoffset = String(326.7 * (paused ? 1 : Math.min(1, s.work_secs / s.interval_secs)));
      }
      $("#phase").textContent = t(PHASES[s.phase] || "Working");
      // the ring already says the countdown; only explain the unusual phases (smart pause, off hours...)
      $("#label").textContent = s.phase === "working" || brk ? "" : s.label;
      $("#take").disabled = !!brk;
      $("#skip").disabled = s.skip_difficulty === "hardcore" || !!brk;
      $("#pause").innerHTML = paused ? withIcon("play_arrow", t("Resume")) : withIcon("pause", t("Pause"));
      if (paused) $("#pauseMenu").hidden = true;
    }

    async function refreshStats() {
      const stats = await invoke("get_stats");
      const d = stats.days[dayKey(new Date())] || {};
      $("#tScreen").textContent = fmtHuman(d.screen_secs || 0);
      $("#tTaken").textContent = d.breaks_taken || 0;
      $("#tScore").textContent = score(d);
    }

    // every action closes the popover, like a menu
    const act = (name, arg) => { action(name, arg); close(); };
    $("#take").onclick = () => act("take_break");
    $("#skip").onclick = () => act("skip");
    $("#settings").onclick = () => act("open_settings");
    $("#pause").onclick = () => {
      if (snap?.phase === "paused") return act("resume");
      $("#pauseMenu").hidden = !$("#pauseMenu").hidden;
      fit();
    };
    document.querySelectorAll("[data-pause]").forEach((b) => (b.onclick = () =>
      b.dataset.pause === "tomorrow" ? act("pause_tomorrow") : act("pause", Number(b.dataset.pause))));
    addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });

    listen("state", render);
    setInterval(refreshStats, 10000);
    render(await invoke("get_state"));
    await refreshStats();
    fit(); // the window stays hidden until the page has laid out, then fit_window shows it
  </script>
</body>
</html>
