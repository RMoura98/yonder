<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Yonder heads-up</title>
  <link rel="stylesheet" href="css/base.css" />
  <style>
    html, body { background: transparent; overflow: hidden; }
    :root { --e: cubic-bezier(.22,.8,.2,1); }
    /* Always a dark frosted card: it sits over any wallpaper and reads like part of the OS. */
    .card {
      margin: 12px; padding: 14px 16px 14px 14px; width: max-content; min-width: 376px; max-width: 480px; box-sizing: border-box;
      color: #EEF4F2;
      background: linear-gradient(180deg, rgba(16, 48, 54, .80), rgba(7, 26, 30, .86));
      backdrop-filter: blur(26px) saturate(1.5);
      border: 1px solid rgba(255,255,255,.12); border-radius: 22px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 16px 40px rgba(0,0,0,.35);
      animation: drop .55s var(--e) both;
      transition: width .45s var(--e), padding .45s var(--e), border-radius .45s var(--e), opacity .3s, transform .3s var(--e);
    }
    @keyframes drop { from { opacity: 0; transform: translateY(-18px) scale(.96); filter: blur(4px); } }
    .card.out { opacity: 0; transform: translateY(-12px) scale(.97); }
    .top { display: flex; align-items: center; gap: 12px; }
    .badge { position: relative; width: 44px; height: 44px; flex: none; }
    .badge svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .badge .bg { fill: url(#face); }
    .badge .trk { fill: none; stroke: rgba(59,29,6,.18); stroke-width: 3; }
    .badge .arc { fill: none; stroke: #3b1d06; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 113.1; transition: stroke-dashoffset 1s linear; }
    .badge .hand { position: absolute; inset: 0; display: grid; place-items: center; color: #3b1d06; }
    .txt { flex: 1; min-width: 0; }
    .count { font-size: 22px; font-weight: 700; letter-spacing: .01em; font-variant-numeric: tabular-nums; line-height: 1.1; }
    .msg { font-size: 12.5px; opacity: .72; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: opacity .3s; }
    .x { border: 0; background: rgba(255,255,255,.08); color: rgba(255,255,255,.7); width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; align-self: flex-start; }
    .x:hover { background: rgba(255,255,255,.16); color: #fff; }
    .row { display: flex; gap: 6px; margin-top: 12px; transition: opacity .3s, max-height .45s var(--e), margin .45s var(--e); max-height: 40px; overflow: hidden; }
    .pill {
      border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.06); color: #fff;
      border-radius: 999px; padding: 7px 12px; font-size: 12.5px; font-weight: 600; white-space: nowrap;
      transition: background .15s, transform .1s var(--e);
    }
    .pill:hover { background: rgba(255,255,255,.16); }
    .pill:active { transform: scale(.95); }
    .pill.main { background: rgba(255,255,255,.16); border-color: transparent; flex: 1; }
    .pill.main:hover { background: rgba(255,255,255,.26); }
    .pill.ghost { border-color: transparent; background: transparent; opacity: .7; }
    /* compact: just the badge and the time */
    .card.mini { width: 152px; padding: 8px 12px 8px 8px; border-radius: 999px; cursor: pointer; }
    .card.mini .badge { width: 30px; height: 30px; }
    .card.mini .count { font-size: 15px; }
    .card.mini .msg, .card.mini .x { display: none; }
    .card.mini .row { opacity: 0; max-height: 0; margin-top: 0; }
    @media (prefers-reduced-motion: reduce) { * { animation-duration: .01s !important; transition-duration: .01s !important; } }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute"><defs>
    <radialGradient id="face" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#FFE9C2"/><stop offset=".5" stop-color="#F4C26B"/><stop offset="1" stop-color="#E8875A"/></radialGradient>
  </defs></svg>
  <div class="card" id="card">
    <div class="top">
      <div class="badge">
        <svg viewBox="0 0 44 44"><circle class="bg" cx="22" cy="22" r="22"/><circle class="trk" cx="22" cy="22" r="18"/><circle class="arc" id="arc" cx="22" cy="22" r="18"/></svg>
        <div class="hand" id="hand"></div>
      </div>
      <div class="txt">
        <div class="count" id="count">01:00</div>
        <div class="msg" id="msg">Almost time. Wrap up your thought.</div>
      </div>
      <button class="x" id="close" title="Minimize"></button>
    </div>
    <div class="row" id="row">
      <button class="pill main" id="now">Start break now</button>
      <button class="pill" data-snooze="1">+1m</button>
      <button class="pill" data-snooze="5">+5m</button>
      <button class="pill" data-snooze="15">+15m</button>
      <button class="pill ghost" id="skip">Skip</button>
    </div>
  </div>
  <script type="module">
    import { invoke, listen, action, applyTheme } from "./js/api.js";
    import { playSound } from "./js/sounds.js";
    import { icon } from "./js/icons.js";
    import { initI18n, applyI18n, t } from "./js/i18n.js";
    const $ = (id) => document.getElementById(id);
    const card = $("card");
    const settings = await invoke("get_settings");
    applyTheme(settings.theme);
    await initI18n(settings.language);
    applyI18n(document);
    $("hand").innerHTML = icon("hourglass_top", 18);
    $("close").innerHTML = icon("close", 15);
    if (settings.skip_difficulty === "hardcore") document.querySelectorAll("[data-snooze],#skip").forEach((b) => b.remove());

    const MESSAGES = [
      "Almost time. Wrap up your thought.",
      "Finish your sentence. Your eyes are next.",
      "A short break is coming up.",
      "Save your work, a breather is near.",
    ];
    $("msg").textContent = t(MESSAGES[Math.floor(Math.random() * MESSAGES.length)]);

    const fit = () => setTimeout(() => {
      const r = card.getBoundingClientRect();
      invoke("fit_window", { width: Math.ceil(r.width + 24), height: Math.ceil(r.height + 24), align: "center" });
    }, 460);
    const mini = (on) => { card.classList.toggle("mini", on); fit(); };

    // Collapse after the "keep expanded" period; click the pill to expand again.
    setTimeout(() => mini(true), Math.max(3, settings.prebreak_visible_secs) * 1000);
    card.addEventListener("click", () => card.classList.contains("mini") && mini(false));

    const lead = Math.max(1, settings.prebreak_secs);
    let finalShown = false;
    const pad = (n) => String(n).padStart(2, "0");
    const render = (s) => {
      if (s.phase === "break") return;
      const left = Math.max(0, s.next_break_in);
      $("count").textContent = `${pad(Math.floor(left / 60))}:${pad(left % 60)}`;
      $("arc").style.strokeDashoffset = String(113.1 * (1 - Math.min(1, left / lead)));
      if (left <= 10 && !finalShown) {
        finalShown = true;
        $("msg").textContent = t(s.next_is_long ? "Long break in a few seconds." : "Starting in a few seconds.");
      }
    };
    const first = await invoke("get_state");
    render(first);
    listen("state", render);
    // Opened as a preview from Settings: close on its own.
    if (first.next_break_in > first.prebreak_secs + 5) setTimeout(() => invoke("fit_window", { width: 0, height: 0 }), 9000);
    if (settings.sound_enabled) playSound("pop", settings.volume * 0.6);

    $("now").onclick = (e) => { e.stopPropagation(); action("start_now"); };
    $("skip")?.addEventListener("click", (e) => { e.stopPropagation(); action("skip"); });
    $("close").onclick = (e) => { e.stopPropagation(); mini(true); };
    document.querySelectorAll("[data-snooze]").forEach((b) => (b.onclick = (e) => { e.stopPropagation(); action("snooze", Number(b.dataset.snooze)); }));
    fit();
  </script>
</body>
</html>
