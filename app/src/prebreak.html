<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Yonder heads-up</title>
  <link rel="stylesheet" href="css/base.css" />
  <style>
    html, body { background: transparent; overflow: hidden; }
    /* the card is centered in its window, and the window is centered on screen,
       so resizing the window never moves the card */
    body { display: flex; justify-content: center; align-items: flex-start; }
    :root { --e: cubic-bezier(.22,.8,.2,1); --fg: #F1F6F5; --fg-2: rgba(241,246,245,.62); --edge: rgba(255,255,255,.11); }
    /* Always a dark glass card: it sits over any wallpaper and reads like part of the OS. */
    .card {
      /* flex: none, or the card shrinks to the window and the window is then fitted to it, clipping the buttons */
      flex: none; margin: 26px; padding: 16px 18px 16px 16px; width: max-content; min-width: 360px; max-width: 500px; box-sizing: border-box;
      color: var(--fg);
      background:
        radial-gradient(120% 140% at 0% 0%, rgba(255,255,255,.07), transparent 55%),
        linear-gradient(180deg, rgba(22, 46, 56, .74), rgba(8, 22, 28, .82));
      backdrop-filter: blur(30px) saturate(1.8);
      border: 1px solid var(--edge); border-radius: 24px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.07), 0 8px 18px rgba(0,0,0,.28), 0 1px 4px rgba(0,0,0,.18);
      animation: drop .6s var(--e) both;
      overflow: hidden;
    }
    @keyframes drop { from { opacity: 0; transform: translateY(-16px) scale(.97); filter: blur(5px); } }
    .top { display: flex; align-items: center; gap: 13px; }
    .badge { flex: none; display: grid; transition: transform .45s var(--e); }
    .badge .clock { display: block; transition: width .45s var(--e), height .45s var(--e); }
    .txt { min-width: 0; }
    .count { font-size: 20px; font-weight: 700; letter-spacing: .01em; font-variant-numeric: tabular-nums; line-height: 1.15; }
    .msg { font-size: 13px; color: var(--fg-2); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row { display: flex; align-items: center; gap: 8px; margin-top: 14px; max-height: 40px; overflow: hidden;
      transition: opacity .3s, max-height .45s var(--e), margin .45s var(--e); }
    .pill {
      height: 34px; padding: 0 15px; border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap; color: var(--fg);
      border: 1px solid rgba(255,255,255,.17); background: transparent;
      transition: background .15s, border-color .15s, transform .1s var(--e);
    }
    .pill:hover { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.26); }
    .pill:active { transform: scale(.96); }
    .pill.main { background: rgba(255,255,255,.13); border-color: transparent; }
    .pill.main:hover { background: rgba(255,255,255,.2); }
    .skip { margin-left: 2px; border: 0; background: none; color: var(--fg-2); font-size: 12.5px; font-weight: 600; padding: 0 6px; height: 34px; border-radius: 999px; }
    .skip:hover { color: var(--fg); }
    /* compact: just the clock and the time; click to expand */
    .card.mini { min-width: 0; padding: 7px 16px 7px 7px; border-radius: 999px; cursor: pointer; }
    .card.mini .clock { width: 30px; height: 30px; }
    .card.mini .count { font-size: 15px; }
    .card.mini .msg { display: none; }
    .card.mini .row { display: none; }
    @media (prefers-reduced-motion: reduce) { * { animation-duration: .01s !important; transition-duration: .01s !important; } }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="top">
      <div class="badge" id="badge"></div>
      <div class="txt">
        <div class="count" id="count">01:00</div>
        <div class="msg" id="msg">Almost time. Wrap up your thought.</div>
      </div>
    </div>
    <div class="row" id="row">
      <button class="pill main" id="now">Start break now</button>
      <button class="pill" data-snooze="1">+1m</button>
      <button class="pill" data-snooze="5">+5m</button>
      <button class="pill" data-snooze="15">+15m</button>
      <button class="skip" id="skip">Skip</button>
    </div>
  </div>
  <script type="module">
    import { invoke, listen, action, applyTheme } from "./js/api.js";
    import { playSound } from "./js/sounds.js";
    import { clockBadge, setClock } from "./js/clock.js";
    import { initI18n, applyI18n, t } from "./js/i18n.js";
    const $ = (id) => document.getElementById(id);
    const card = $("card");
    const settings = await invoke("get_settings");
    applyTheme(settings.theme);
    await initI18n(settings.language);
    applyI18n(document);
    $("badge").innerHTML = clockBadge(44);
    if (settings.skip_difficulty === "hardcore") document.querySelectorAll("[data-snooze],#skip").forEach((b) => b.remove());

    const MESSAGES = [
      "Almost time. Wrap up your thought.",
      "Finish your sentence. Your eyes are next.",
      "A short break is coming up.",
      "Save your work, a breather is near.",
    ];
    $("msg").textContent = t(MESSAGES[Math.floor(Math.random() * MESSAGES.length)]);

    const fitTo = (r) => invoke("fit_window", { width: Math.ceil(r.width + 52), height: Math.ceil(r.height + 52), align: "center" });
    const fit = () => fitTo(card.getBoundingClientRect());

    // Expand/collapse by animating the card's real size (FLIP). The window grows
    // before an expansion and shrinks after a collapse, so nothing clips or jumps.
    let anim;
    // The text can change while the card is open (a longer message, "Waiting for a pause
    // in your typing…"); grow or shrink the window with it so nothing gets cut off.
    // During an expand/collapse animation the window is fitted by mini() instead.
    let lastW = 0, lastH = 0;
    new ResizeObserver(() => {
      if (anim && anim.playState === "running") return;
      const r = card.getBoundingClientRect();
      if (Math.abs(r.width - lastW) < 1 && Math.abs(r.height - lastH) < 1) return;
      lastW = r.width; lastH = r.height;
      fitTo(r);
    }).observe(card);
    const mini = (on) => {
      if (card.classList.contains("mini") === on) return;
      anim?.cancel();
      const cs0 = getComputedStyle(card);
      const from = { width: card.offsetWidth + "px", height: card.offsetHeight + "px", borderRadius: cs0.borderTopLeftRadius };
      card.classList.toggle("mini", on);
      const r1 = card.getBoundingClientRect();
      const to = { width: r1.width + "px", height: r1.height + "px", borderRadius: getComputedStyle(card).borderTopLeftRadius };
      const growing = !on;
      if (growing) fitTo(r1);
      anim = card.animate([from, to], { duration: 420, easing: "cubic-bezier(.22,.8,.2,1)" });
      anim.finished.then(() => { if (!growing) fitTo(r1); }).catch(() => {});
    };

    // Collapse after the "keep expanded" period; click the pill to expand again.
    setTimeout(() => mini(true), Math.max(3, settings.prebreak_visible_secs) * 1000);
    card.addEventListener("click", () => card.classList.contains("mini") && mini(false));

    const lead = Math.max(1, settings.prebreak_secs);
    let finalShown = false;
    const pad = (n) => String(n).padStart(2, "0");
    const render = (s) => {
      if (s.phase === "break") return;
      const left = Math.max(0, s.next_break_in);
      $("count").textContent = `${pad(Math.floor(left / 60))}:${pad(left % 60)}`;
      // the hand sweeps once around as the break approaches
      setClock(card, 1 - Math.min(1, left / lead));
      if (left <= 10 && !finalShown) {
        finalShown = true;
        $("msg").textContent = t(s.next_is_long ? "Long break in a few seconds." : "Starting in a few seconds.");
        if (card.classList.contains("mini")) mini(false);
      }
      // Smart pause held the break too long: explain why it's showing up now.
      if (s.overdue && !finalShown) $("msg").textContent = t("You've been busy for a while. A short break?");
      // Due, but you're typing: say so instead of sitting at 00:00.
      if (s.holding && !holdingShown) {
        holdingShown = true;
        $("msg").textContent = t("Waiting for a pause in your typing…");
        if (card.classList.contains("mini")) mini(false);
      }
    };
    let holdingShown = false;
    const first = await invoke("get_state");
    render(first);
    listen("state", render);
    // Opened as a preview from Settings: close on its own.
    if (first.next_break_in > first.prebreak_secs + 5) setTimeout(() => invoke("fit_window", { width: 0, height: 0 }), 9000);
    if (settings.sound_enabled) playSound("pop", settings.volume * 0.6);

    $("now").onclick = (e) => { e.stopPropagation(); action("start_now"); };
    $("skip")?.addEventListener("click", (e) => { e.stopPropagation(); action("skip"); });
    document.querySelectorAll("[data-snooze]").forEach((b) => (b.onclick = (e) => { e.stopPropagation(); action("snooze", Number(b.dataset.snooze)); }));
    fit();
  </script>
</body>
</html>
