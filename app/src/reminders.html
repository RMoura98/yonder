<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Yonder reminder</title>
  <link rel="stylesheet" href="css/base.css" />
  <style>
    html, body { background: transparent; overflow: hidden; }
    :root { --orb: radial-gradient(circle at 32% 26%, #FFF0D2 0%, #F7CC7A 38%, #F0A45F 70%, #E0784F 100%); --ink-on-orb: #3b1d06; }
    #wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px; width: max-content; margin: 0 auto; }

    /* ---------- the liquid glass widgets (posture + blink) */
    .stage { position: relative; width: 112px; flex: none; }
    .stage.posture { height: 196px; }
    .stage.blink { height: 112px; }
    .tube {
      position: absolute; left: 50%; transform: translateX(-50%);
      width: 8px; height: 8px; top: 0; opacity: 0; border-radius: 999px; overflow: hidden;
      background: rgba(7, 30, 34, .46);
      backdrop-filter: blur(18px) saturate(1.6);
      border: 1px solid rgba(255, 255, 255, .16);
      box-shadow: inset 0 1px 1px rgba(255,255,255,.18), inset 0 -10px 20px rgba(0,0,0,.18), 0 10px 26px rgba(0,0,0,.28);
    }
    .orb {
      position: absolute; left: 50%; top: 6px; width: 50px; height: 50px; margin-left: -25px; border-radius: 50%;
      background: var(--orb); transform: scale(0); opacity: 0;
      box-shadow: inset 0 -5px 10px rgba(150, 70, 20, .3), inset 0 3px 6px rgba(255, 255, 255, .35);
      display: grid; place-items: center;
    }
    .orb svg { width: 50px; height: 50px; overflow: visible; }
    .orb .stroke { fill: none; stroke: var(--ink-on-orb); stroke-width: 3.8; stroke-linecap: round; stroke-linejoin: round; }
    .orb .shaft { stroke-dasharray: 1; stroke-dashoffset: 1; }
    .orb .chev { opacity: 0; }
    .eye { transform-box: fill-box; transform-origin: center; }
    .stage.clickable { cursor: pointer; }
    .done-pill {
      position: absolute; left: 50%; bottom: -2px; transform: translateX(-50%); opacity: 0;
      border: 0; border-radius: 999px; padding: 4px 11px; font-size: 11.5px; font-weight: 650; white-space: nowrap;
      color: #fff; background: rgba(7, 30, 34, .62); backdrop-filter: blur(12px);
      display: inline-flex; align-items: center; gap: 4px; transition: opacity .3s;
    }
    .stage.waiting .done-pill { opacity: 1; }

    /* ---------- pill card for custom reminders */
    .card {
      position: relative; display: flex; align-items: center; gap: 12px; margin: 8px;
      background: color-mix(in srgb, var(--panel) 90%, transparent); backdrop-filter: blur(22px);
      border: 1px solid var(--line); border-radius: 999px; box-shadow: 0 10px 30px rgba(0,0,0,.18);
      padding: 8px 10px 8px 8px; max-width: 380px; transform-origin: top center;
    }
    .card .icon { width: 38px; height: 38px; border-radius: 50%; flex: none; display: grid; place-items: center; background: var(--orb); color: #fff; }
    .card .t { font-weight: 650; }
    .card .b { color: var(--ink-2); font-size: 12px; }
    .card .txt { flex: 1; min-width: 0; padding-right: 4px; }
    .card .done { border-radius: 999px; padding: 5px 12px; font-size: 12px; display: inline-flex; align-items: center; gap: 4px; }
    .card.small { padding: 5px 12px 5px 5px; } .card.small .icon { width: 30px; height: 30px; } .card.small .b { display: none; }
    .card.large { border-radius: 24px; padding: 14px 16px 14px 14px; max-width: 420px; }
    .card.large .icon { width: 52px; height: 52px; } .card.large .t { font-size: 16px; }

    /* ---------- waiting reminders collect in a small orb */
    .stack {
      width: 40px; height: 40px; border-radius: 50%; background: var(--orb); color: #fff; font-weight: 750; margin: 6px;
      display: grid; place-items: center; cursor: pointer; border: 1px solid rgba(255,255,255,.5);
      box-shadow: 0 6px 20px rgba(232,135,90,.4), inset 0 0 12px rgba(255,255,255,.4);
    }
  </style>
</head>
<body>
  <div id="wrap"></div>
  <script type="module">
    import { invoke, listen, action, applyTheme } from "./js/api.js";
    import { playSound } from "./js/sounds.js";
    import { icon } from "./js/icons.js";
    const wrap = document.getElementById("wrap");
    const settings = await invoke("get_settings");
    applyTheme(settings.theme);
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
    const EASE = "cubic-bezier(.62,0,.18,1)";
    const SPRING = "cubic-bezier(.3,1.5,.5,1)";
    const run = (el, frames, ms, opts = {}) =>
      el.animate(frames, { duration: reduce ? 1 : ms, fill: "forwards", easing: "linear", ...opts }).finished;

    let active = []; // {r, el}
    let folded = [];

    const fit = () => requestAnimationFrame(() => {
      if (!active.length && !folded.length) return invoke("fit_window", { width: 0, height: 0 });
      const r = wrap.getBoundingClientRect();
      invoke("fit_window", { width: Math.ceil(r.width), height: Math.ceil(r.height) });
    });

    // ----------------------------------------------------------- choreography
    // A dot swells into a glass bead; the orb pops in; the glass stretches upward
    // carrying the orb while the chevron grows into an arrow; the tail catches up.
    async function posture(stage, waitForTap) {
      const tube = stage.querySelector(".tube"), orb = stage.querySelector(".orb");
      const chev = stage.querySelector(".chev"), shaft = stage.querySelector(".shaft");
      const T = (top, h, w, o = 1) => ({ top: top + "px", height: h + "px", width: w + "px", opacity: o, easing: EASE });
      await Promise.all([
        run(tube, [
          { ...T(144, 8, 8, 0), offset: 0 }, { ...T(114, 64, 64), offset: .2 }, { ...T(114, 64, 64), offset: .42 },
          { ...T(14, 164, 64), offset: .74 }, { ...T(14, 64, 64), offset: 1 },
        ], 1900),
        run(orb, [
          { transform: "scale(0)", opacity: 0, offset: 0 }, { transform: "scale(0)", opacity: 0, offset: .17, easing: SPRING },
          { transform: "scale(1)", opacity: 1, offset: .36 }, { transform: "scale(1)", opacity: 1, offset: .5, easing: EASE },
          { transform: "scale(1.06, .94)", opacity: 1, offset: .66, easing: EASE }, { transform: "scale(1)", opacity: 1, offset: 1 },
        ], 1900),
        run(chev, [{ opacity: 0, offset: 0 }, { opacity: 0, offset: .32 }, { opacity: 1, offset: .42 }, { opacity: 1, offset: 1 }], 1900),
        run(shaft, [{ strokeDashoffset: 1, offset: 0 }, { strokeDashoffset: 1, offset: .55, easing: EASE }, { strokeDashoffset: 0, offset: .88 }, { strokeDashoffset: 0, offset: 1 }], 1900),
      ]);
      await waitForTap(1100);
      await Promise.all([
        run(orb, [{ transform: "scale(1)", opacity: 1, easing: EASE }, { transform: "scale(.4)", opacity: 0, offset: .45 }, { transform: "scale(.4)", opacity: 0 }], 800),
        run(tube, [
          { ...T(14, 64, 64), offset: 0 }, { ...T(14, 64, 64), offset: .25 }, { ...T(28, 36, 36), offset: .6 }, { ...T(42, 8, 8, 0), offset: 1 },
        ], 800),
      ]);
    }

    // A glass bead appears, the orb's face blinks twice, then it all shrinks away.
    async function blink(stage, waitForTap) {
      const tube = stage.querySelector(".tube"), orb = stage.querySelector(".orb");
      const eyes = stage.querySelectorAll(".eye");
      const T = (top, s, o = 1) => ({ top: top + "px", height: s + "px", width: s + "px", opacity: o, easing: EASE });
      await Promise.all([
        run(tube, [{ ...T(52, 8, 0), offset: 0 }, { ...T(24, 64), offset: .45 }, { ...T(24, 64), offset: 1 }], 1000),
        run(orb, [{ transform: "scale(0)", opacity: 0, offset: 0 }, { transform: "scale(0)", opacity: 0, offset: .35, easing: SPRING }, { transform: "scale(1)", opacity: 1, offset: .8 }, { transform: "scale(1)", opacity: 1 }], 1000),
      ]);
      const blinkFrames = [
        { transform: "scaleY(1)", offset: 0 }, { transform: "scaleY(1)", offset: .12, easing: "ease-in" },
        { transform: "scaleY(.08)", offset: .2, easing: "ease-out" }, { transform: "scaleY(1)", offset: .3 },
        { transform: "scaleY(1)", offset: .48, easing: "ease-in" }, { transform: "scaleY(.08)", offset: .56, easing: "ease-out" },
        { transform: "scaleY(1)", offset: .66 }, { transform: "scaleY(1)", offset: 1 },
      ];
      eyes.forEach((e) => run(e, blinkFrames, 1900));
      await sleep(reduce ? 0 : 1900);
      await waitForTap(200);
      await Promise.all([
        run(orb, [{ transform: "scale(1)", opacity: 1, easing: EASE }, { transform: "scale(.4)", opacity: 0, offset: .45 }, { transform: "scale(.4)", opacity: 0 }], 800),
        run(tube, [{ ...T(24, 64), offset: 0 }, { ...T(24, 64), offset: .25 }, { ...T(38, 36), offset: .6 }, { ...T(52, 8, 0), offset: 1 }], 800),
      ]);
    }

    const ARROW = `<svg viewBox="0 0 50 50"><path class="stroke chev" d="M16 24 L25 15 L34 24"/><path class="stroke shaft" pathLength="1" d="M25 16 L25 36"/></svg>`;
    const FACE = `<svg viewBox="0 0 50 50"><g fill="var(--ink-on-orb)"><ellipse class="eye" cx="18" cy="22" rx="3.6" ry="4.6"/><ellipse class="eye" cx="32" cy="22" rx="3.6" ry="4.6"/></g>
      <path class="stroke" d="M19 32 Q25 36 31 32" style="stroke-width:3"/></svg>`;

    function widget(r) {
      const kind = r.id === "posture" ? "posture" : "blink";
      const el = document.createElement("div");
      el.className = `stage ${kind}`;
      el.title = r.title;
      el.innerHTML = `<div class="tube"><div class="orb">${kind === "posture" ? ARROW : FACE}</div></div>
        ${r.sticky ? `<button class="done-pill">${icon("check", 13)} Done</button>` : ""}`;
      return el;
    }

    async function playWidget(item) {
      const { r, el } = item;
      const waitForTap = (holdMs) => r.sticky
        ? new Promise((res) => { el.classList.add("waiting", "clickable"); el.addEventListener("click", res, { once: true }); })
            .then(() => { el.classList.remove("waiting"); action("reminder_done"); })
        : sleep(holdMs);
      await (r.id === "posture" ? posture : blink)(el, waitForTap);
      finish(item);
    }

    function card(r) {
      const el = document.createElement("div");
      el.className = `card ${r.size || "medium"}`;
      el.innerHTML = `<div class="icon">${icon(r.icon, r.size === "large" ? 28 : 20)}</div>
        <div class="txt"><div class="t">${esc(r.title)}</div>${r.body ? `<div class="b">${esc(r.body)}</div>` : ""}</div>
        <button class="btn done">${r.sticky ? icon("check", 14) + " Done" : "OK"}</button>`;
      return el;
    }

    async function playCard(item) {
      const { r, el } = item;
      await run(el, [{ opacity: 0, transform: "translateY(-14px) scale(.9)", filter: "blur(6px)" }, { opacity: 1, transform: "none", filter: "blur(0)", easing: SPRING }], 520);
      await new Promise((res) => {
        el.querySelector(".done").addEventListener("click", () => { action("reminder_done"); res(); }, { once: true });
        if (!r.sticky) setTimeout(res, r.size === "large" ? 14000 : 9000);
      });
      await run(el, [{ opacity: 1, transform: "none", filter: "blur(0)" }, { opacity: 0, transform: "translateY(-10px) scale(.95)", filter: "blur(4px)", easing: EASE }], 380);
      finish(item);
    }

    function finish(item) {
      item.el.remove();
      active = active.filter((a) => a !== item);
      if (!active.some((a) => a.r.sticky) && folded.length) show(folded.splice(0), true);
      renderStack();
      fit();
    }

    function renderStack() {
      wrap.querySelector(".stack")?.remove();
      if (!folded.length) return;
      const s = document.createElement("div");
      s.className = "stack";
      s.title = folded.map((r) => r.title).join(", ");
      s.textContent = folded.length;
      s.onclick = () => show(folded.splice(0), true);
      wrap.prepend(s);
    }

    function show(list, quiet = false) {
      // While a reminder waits to be ticked off, newcomers collect in a small orb.
      if (active.some((a) => a.r.sticky)) {
        folded.push(...list);
        renderStack();
        fit();
        return;
      }
      if (!quiet && settings.sound_enabled) {
        const s = list.find((r) => r.sound && r.sound !== "none");
        if (s) playSound(s.sound, settings.volume);
      }
      for (const r of list) {
        const isWidget = r.id === "posture" || r.id === "blink";
        const el = isWidget ? widget(r) : card(r);
        const item = { r, el };
        wrap.appendChild(el);
        active.push(item);
        isWidget ? playWidget(item) : playCard(item);
      }
      renderStack();
      fit();
    }

    async function pull() {
      const list = await invoke("take_reminders");
      if (list.length) show(list);
    }
    listen("reminders-updated", pull);
    pull();
  </script>
</body>
</html>
